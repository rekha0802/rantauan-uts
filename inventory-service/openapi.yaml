openapi: 3.1.0
info:
  title: Inventory Service Rantau.an Hijab
  version: 0.3.0
  description: |
    Rancangan awal API produk dan stok internal.
    Pengembangan menggunakan data simulasi, bukan data owner.
  contact:
    name: RENR Project

servers:
  - url: http://localhost:8000/api
    description: Lingkungan lokal Laravel Sail

tags:
  - name: Produk
    description: Pengelolaan produk dan stok internal

paths:
  /v1/produk:
    get:
      tags: [Produk]
      operationId: daftarProduk
      summary: Melihat daftar produk
      description: |
        Produk diurutkan berdasarkan SKU.
        Tanpa parameter limit, seluruh produk ditampilkan.
        Jika diberikan, limit harus integer antara 1 dan 100.
      parameters:
        - name: limit
          in: query
          required: false
          description: Batas jumlah produk yang ditampilkan
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
      responses:
        '200':
          description: Daftar produk berhasil ditampilkan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Produk'
        '422':
          description: Parameter limit tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Produk]
      operationId: tambahProduk
      summary: Membuat produk internal
      description: |
        SKU harus unik. SKU, nama, dan harga wajib diisi.
        Stok bernilai 0 jika tidak dikirim.
        Data tidak valid atau SKU yang sudah digunakan menghasilkan 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TambahProduk'
      responses:
        '201':
          description: Produk berhasil dibuat
          headers:
            Location:
              description: Alamat detail produk yang baru dibuat
              schema:
                type: string
                format: uri
              example: http://localhost:8000/api/v1/produk/HJB-001
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Produk'
        '422':
          description: Data tidak valid atau SKU sudah digunakan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/produk/{sku}:
    get:
      tags: [Produk]
      operationId: detailProduk
      summary: Melihat detail satu produk
      description: Mengembalikan produk berdasarkan SKU internal.
      parameters:
        - name: sku
          in: path
          required: true
          description: SKU internal produk yang dicari
          schema:
            type: string
          example: HJB-001
      responses:
        '200':
          description: Produk ditemukan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Produk'
        '404':
          description: Produk tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://rantauan.test/problem/tidak-ditemukan
                title: Produk tidak ditemukan
                status: 404
                detail: Tidak ada produk dengan SKU tersebut.
                instance: /api/v1/produk/HJB-999

  /v1/produk/{sku}/penyesuaian-stok:
    post:
      tags: [Produk]
      operationId: sesuaikanStok
      summary: Menambah atau mengurangi stok produk
      description: |
        Perubahan positif menambah stok dan negatif mengurangi stok.
        Stok tidak boleh menjadi negatif.
        Alasan penjualan wajib memakai perubahan negatif.
        Alasan restok wajib memakai perubahan positif.
        Koreksi boleh positif atau negatif, tetapi bukan nol.
        Operation_id yang sama dengan payload sama mengembalikan
        hasil operasi sebelumnya tanpa mengubah stok lagi.
        Operation_id yang sama dengan payload berbeda menghasilkan 409.
      parameters:
        - name: sku
          in: path
          required: true
          description: SKU internal produk
          schema:
            type: string
          example: HJB-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_id, perubahan, alasan]
              allOf:
                - if:
                    required: [alasan]
                    properties:
                      alasan:
                        const: penjualan
                  then:
                    properties:
                      perubahan:
                        maximum: -1
                - if:
                    required: [alasan]
                    properties:
                      alasan:
                        const: restok
                  then:
                    properties:
                      perubahan:
                        minimum: 1
              properties:
                operation_id:
                  type: string
                  format: uuid
                  description: Identitas operasi yang tetap sama saat retry
                  example: '11111111-1111-4111-8111-111111111111'
                perubahan:
                  type: integer
                  not:
                    const: 0
                  example: -2
                alasan:
                  type: string
                  enum: [penjualan, restok, koreksi]
                  example: penjualan
      responses:
        '200':
          description: Hasil penyesuaian stok atau hasil operasi sebelumnya
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Produk'
        '404':
          description: Produk tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Stok tidak cukup atau operation_id digunakan dengan payload berbeda
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Isi permintaan tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    Produk:
      type: object
      required: [sku, nama, harga, stok, diperbarui_pada]
      properties:
        sku:
          type: string
          description: Identitas produk internal
          example: HJB-001
        nama:
          type: string
          example: Hijab Simulasi Hitam
        harga:
          type: integer
          minimum: 0
          description: Harga master dalam rupiah
          example: 45000
        stok:
          type: integer
          minimum: 0
          example: 20
        diperbarui_pada:
          type: string
          format: date-time
          example: '2026-10-26T09:00:00+07:00'

    TambahProduk:
      type: object
      required: [sku, nama, harga]
      properties:
        sku:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{3}$'
          description: SKU internal unik, bukan SKU marketplace
          example: HJB-001
        nama:
          type: string
          minLength: 1
          maxLength: 120
          example: Produk Simulasi A
        harga:
          type: integer
          minimum: 0
          description: Harga master simulasi dalam rupiah
          example: 45000
        stok:
          type: integer
          minimum: 0
          default: 0
          example: 20

    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://rantauan.test/problem/validasi-gagal
        title:
          type: string
          example: Isi permintaan tidak valid
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          example: Satu atau lebih field tidak memenuhi kontrak.
        instance:
          type: string
          example: /api/v1/produk
        errors:
          type: object
          description: Pesan validasi per field tanpa menampilkan nilai masukan
          additionalProperties:
            type: array
            items:
              type: string
